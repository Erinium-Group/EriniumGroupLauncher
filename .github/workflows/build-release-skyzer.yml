name: Build & Release — Skyzer Launcher

on:
  push:
    branches: [skyzer]

permissions:
  contents: write

jobs:
  # Step 1: Bump version, tag, et pré-créer la release draft
  version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    outputs:
      version: ${{ steps.bump.outputs.version }}
      release_tag: ${{ steps.bump.outputs.release_tag }}
      git_tag: ${{ steps.bump.outputs.git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if echo "$COMMIT_MSG" | grep -qi '\[major\]'; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif echo "$COMMIT_MSG" | grep -qi '\[minor\]'; then
            NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
          else
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          node -e "
            const pkg = require('./package.json');
            pkg.version = '$NEW_VERSION';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # release_tag = v{version} — ce que electron-builder utilise pour trouver la release
          # git_tag = skyzer-v{version} — pour identifier les commits skyzer dans l'historique git
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "git_tag=skyzer-v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped: $CURRENT -> $NEW_VERSION"

      - name: Commit, tag et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.git_tag }}"
          git push origin skyzer --tags

      # Pré-créer la release draft avec le tag v{version} que electron-builder cherche.
      # Sans ça, les 3 runners essaient de la créer en même temps → race condition.
      - name: Créer release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.release_tag }}" \
            --repo Erinium-Group/EriniumGroupLauncher \
            --target skyzer \
            --draft \
            --title "Skyzer Launcher ${{ steps.bump.outputs.version }}" \
            --notes "## Skyzer Launcher ${{ steps.bump.outputs.version }}"

  # Step 2: Build sur les 3 plateformes
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.git_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --${{ matrix.platform }} --publish always

  # Step 3: Publier la release (passer de draft à publique)
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publier release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.version.outputs.release_tag }}" \
            --repo Erinium-Group/EriniumGroupLauncher \
            --draft=false \
            --title "Skyzer Launcher ${{ needs.version.outputs.version }}" \
            --latest=false
