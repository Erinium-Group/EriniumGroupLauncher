<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyzer: Adventures Beyond — Connexion</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="titlebar titlebar-login">
    <span></span>
    <div class="titlebar-controls">
      <button class="titlebar-btn close" id="btnClose" title="Fermer">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="login-container fade-in">
    <div class="ambient-glow glow-violet"></div>
    <div class="ambient-glow glow-cyan"></div>

    <!-- Logo / titre -->
    <div class="logo-area">
      <div class="logo-glow"></div>
      <img class="logo-icon-img" src="../../assets/icon.png" alt="Skyzer" onerror="this.style.display='none'">
    </div>

    <h1 class="login-title">
      <span class="gradient-text">Skyzer</span>
    </h1>
    <p class="login-subtitle">Adventures Beyond</p>
    <p class="login-desc">Connectez-vous avec votre compte Minecraft officiel</p>

    <!-- Bouton Microsoft -->
    <div class="login-actions" id="loginActions">
      <button class="btn btn-microsoft" id="btnMicrosoft">
        <svg width="20" height="20" viewBox="0 0 21 21" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="9" height="9" fill="#F35325"/>
          <rect x="11" y="1" width="9" height="9" fill="#81BC06"/>
          <rect x="1" y="11" width="9" height="9" fill="#05A6F0"/>
          <rect x="11" y="11" width="9" height="9" fill="#FFBA08"/>
        </svg>
        Se connecter avec Microsoft
      </button>
    </div>

    <!-- Chargement -->
    <div class="login-loading hidden" id="loginLoading">
      <div class="glass-panel-sm loading-box">
        <div class="spinner-ring small"></div>
        <span>Connexion en cours...</span>
      </div>
    </div>

    <!-- Erreur -->
    <div class="login-error hidden" id="loginError">
      <div class="glass-panel-sm error-box">
        <p class="error-message" id="errorMessage">Erreur inconnue</p>
        <button class="btn btn-ghost" id="btnRetry">Réessayer</button>
      </div>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <p class="login-cgv">Minecraft Java Edition requis</p>
      <button class="btn-link" id="btnQuit">Quitter</button>
      <p class="version-text" id="versionText">v1.0.0</p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
